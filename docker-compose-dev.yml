---
version: '3.8'

services:
  mongo-db:
    image: mongo:8
    container_name: mongo-db
    volumes:
      - ./mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - pandemic-network

  redis-db:
    image: redis:8
    container_name: redis-db
    ports:
      - "6379:6379"
    networks:
      - pandemic-network

  django-backend:
    build:
      context: .
      dockerfile: Dockerfile-django
    container_name: django-backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - mongo-db
      - redis-db
    environment:
      - DEBUG=1
      - CELERY_BROKER_URL=redis://redis-db:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-db:6379/0
    networks:
      - pandemic-network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile-worker
    container_name: celery-worker
    command: celery -A pet.pes_task worker --loglevel=INFO
    volumes:
      - ./backend:/app
    depends_on:
      - mongo-db
      - redis-db
      - django-backend
    environment:
      - CELERY_BROKER_URL=redis://redis-db:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-db:6379/0
    networks:
      - pandemic-network

  dash-frontend:
    build:
      context: .
      dockerfile: Dockerfile-dash
    container_name: dash-frontend
    ports:
      - "8050:8050"
    depends_on:
      - django-backend
    environment:
      - API_BASE_URL=http://django-backend:8000
    volumes:
      - ./frontend:/app/frontend
    networks:
      - pandemic-network

networks:
  pandemic-network:
    driver: bridge

volumes:
  mongo-data:
